        ],

        }
      },
      {

        avatar: '⚔️',

        stats: { total: 340, painted: 230, wip: 30, backlog: 80 },

        factions: [

          { name: 'Space Wolves', system: 'Warhammer 40K', painted: 100, wip: 20, backlog: 60 }
        ],
        featuredModel: {

          system: 'Saga',

          notes: 'Historical shield patterns hand-painted with wet blending.',

          date: 'Jul 25, 2026'
        }
      },
      {
        id: 'u10',
        name: 'ShadowHobbyer',
        avatar: '🕶️',
        isPublic: false,
        stats: { total: 210, painted: 50, wip: 60, backlog: 100 },
        monthlyOutput: 5,
        yearlyOutput: 35,
        factions: [{ name: 'Marvel Crisis Protocol', system: 'MCP', painted: 50, wip: 60, backlog: 100 }],
        featuredModel: null
      }
    ];

    function App() {
      // Main View Navigation: 'home' | 'leaderboard' | 'personal'
      const [currentTab, setCurrentTab] = useState('home');

      // Leaderboard Sub-Tab Navigation: 'monthly' | 'yearly' | 'global'
      const [leaderboardSubTab, setLeaderboardSubTab] = useState('monthly');

      // Privacy setting for current user dashboard visibility
      const [isDashboardPublic, setIsDashboardPublic] = useState(false);

      // Current User Personal Stats
      const [monthlyCompleted, setMonthlyCompleted] = useState(16);
      const [yearlyCompleted, setYearlyCompleted] = useState(115);

      // Personal Factions State
      const [factions, setFactions] = useState([
        { id: '1', name: 'Orks', system: 'Warhammer 40K', painted: 140, wip: 20, backlog: 80 },
        { id: '2', name: 'Imperial Fists', system: 'Warhammer 40K', painted: 65, wip: 15, backlog: 45 },
        { id: '3', name: 'Terrain', system: 'Agnostic', painted: 15, wip: 5, backlog: 25 },
      ]);

      const [newCategoryName, setNewCategoryName] = useState('');
      const [newCategorySystem, setNewCategorySystem] = useState('');
      const [showManageModal, setShowManageModal] = useState(false);

      const [featuredModel, setFeaturedModel] = useState({
        title: 'Ork Warboss in Mega Armour',
        faction: 'Orks',
        date: 'August 2026',
        notes: 'Used Citadel Orruk Flesh, Zenithal highlight with acrylic inks, and Grimdark Streaking Grime enamel wash.',
        imageUrl: 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=800&auto=format&fit=crop'
      });

      const [gallery, setGallery] = useState([
        {
          id: '101',
          title: 'Ork Warboss in Mega Armour',
          faction: 'Orks',
          count: 1,
          transitionType: 'wip_to_painted',
          date: 'Aug 3, 2026',
          notes: 'Enamel weathering and custom resin base.',
          imageUrl: 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=800&auto=format&fit=crop'
        },
        {
          id: '102',
          title: 'Imperial Fists Intercessor Squad',
          faction: 'Imperial Fists',
          count: 5,
          transitionType: 'backlog_to_painted',
          date: 'Jul 28, 2026',
          notes: 'Averland Sunset base with pink undertone shadows.',
          imageUrl: 'https://images.unsplash.com/photo-1563089145-599997674d42?q=80&w=800&auto=format&fit=crop'
        }
      ]);

      const [form, setForm] = useState({
        faction: 'Orks',
        transition: 'wip_to_painted',
        amount: 1,
        title: '',
        notes: '',
        imageUrl: '',
        setFeatured: false
      });

      const formRef = useRef(null);

      const scrollToForm = () => {
        if (formRef.current) {
          formRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      };

      const handleAddCategory = (e) => {
        e.preventDefault();
        if (!newCategoryName.trim()) return;

        const createdCategory = {
          id: Date.now().toString(),
          name: newCategoryName.trim(),
          system: newCategorySystem.trim() || 'Custom',
          painted: 0,
          wip: 0,
          backlog: 0
        };

        setFactions(prev => [...prev, createdCategory]);
        if (!form.faction) {
          setForm(prev => ({ ...prev, faction: createdCategory.name }));
        }

        setNewCategoryName('');
        setNewCategorySystem('');
      };

      const handleRemoveCategory = (id, name) => {
        if (factions.length <= 1) {
          alert('You must keep at least one category/army.');
          return;
        }

        if (confirm(`Are you sure you want to delete "${name}"? This will remove its bucket counts.`)) {
          const updated = factions.filter(f => f.id !== id);
          setFactions(updated);

          if (form.faction === name) {
            setForm(prev => ({ ...prev, faction: updated[0].name }));
          }
        }
      };

      const handleStepperAdjust = (factionName, bucket, delta) => {
        setFactions(prev => prev.map(f => {
          if (f.name === factionName) {
            const newVal = Math.max(0, f[bucket] + delta);
            return { ...f, [bucket]: newVal };
          }
          return f;
        }));
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setForm(prev => ({ ...prev, imageUrl: reader.result }));
          };
          reader.readAsDataURL(file);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const amt = parseInt(form.amount) || 1;

        setFactions(prev => prev.map(f => {
          if (f.name === form.faction) {
            let { painted, wip, backlog } = f;

            switch (form.transition) {
              case 'new_purchase':
                backlog += amt;
                break;
              case 'backlog_to_wip':
                backlog = Math.max(0, backlog - amt);
                wip += amt;
                break;
              case 'wip_to_painted':
                wip = Math.max(0, wip - amt);
                painted += amt;
                setMonthlyCompleted(m => m + amt);
                setYearlyCompleted(y => y + amt);
                break;
              case 'backlog_to_painted':
                backlog = Math.max(0, backlog - amt);
                painted += amt;
                setMonthlyCompleted(m => m + amt);
                setYearlyCompleted(y => y + amt);
                break;
              case 'sold_trim':
                backlog = Math.max(0, backlog - amt);
                break;
              default:
                break;
            }

            return { ...f, painted, wip, backlog };
          }
          return f;
        }));

        const isFinishing = form.transition === 'wip_to_painted' || form.transition === 'backlog_to_painted';
        const imgToUse = form.imageUrl || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=800&auto=format&fit=crop';

        if (form.title || isFinishing) {
          const newEntry = {
            id: Date.now().toString(),
            title: form.title || `${amt}x ${form.faction} Models`,
            faction: form.faction,
            count: amt,
            transitionType: form.transition,
            date: 'Today',
            notes: form.notes || 'No recipe notes recorded.',
            imageUrl: imgToUse
          };
          setGallery(prev => [newEntry, ...prev]);

          if (form.setFeatured) {
            setFeaturedModel({
              title: newEntry.title,
              faction: newEntry.faction,
              date: 'August 2026',
              notes: newEntry.notes,
              imageUrl: imgToUse
            });
          }
        }

        setForm({
          faction: form.faction,
          transition: 'wip_to_painted',
          amount: 1,
          title: '',
          notes: '',
          imageUrl: '',
          setFeatured: false
        });
      };

      // Personal Totals
      const totalPainted = factions.reduce((acc, f) => acc + f.painted, 0);
      const totalWip = factions.reduce((acc, f) => acc + f.wip, 0);
      const totalBacklog = factions.reduce((acc, f) => acc + f.backlog, 0);
      const totalCollection = totalPainted + totalWip + totalBacklog;
      const completionRate = totalCollection ? ((totalPainted / totalCollection) * 100).toFixed(1) : 0;

      // Global Featured Model
      const publicUsersWithFeatured = INITIAL_COMMUNITY_USERS.filter(u => u.isPublic && u.featuredModel);
      const dayOfYear = 215; 
      const dailyFeaturedIndex = dayOfYear % publicUsersWithFeatured.length;
      const dailyFeaturedUser = publicUsersWithFeatured[dailyFeaturedIndex];

      // Global Metrics
      const globalTotalModels = INITIAL_COMMUNITY_USERS.reduce((acc, u) => acc + u.stats.total, 0) + totalCollection;
      const globalTotalPainted = INITIAL_COMMUNITY_USERS.reduce((acc, u) => acc + u.stats.painted, 0) + totalPainted;
      const globalTotalWip = INITIAL_COMMUNITY_USERS.reduce((acc, u) => acc + u.stats.wip, 0) + totalWip;
      const globalTotalBacklog = INITIAL_COMMUNITY_USERS.reduce((acc, u) => acc + u.stats.backlog, 0) + totalBacklog;

      // Personal Dashboard Charts Ref
      const donutRef = useRef(null);
      const barRef = useRef(null);
      const donutInstance = useRef(null);
      const barInstance = useRef(null);

      // Global Pie Chart Ref
      const globalPieRef = useRef(null);
      const globalPieInstance = useRef(null);

      useEffect(() => {
        if (currentTab === 'personal') {
          if (donutInstance.current) donutInstance.current.destroy();
          if (barInstance.current) barInstance.current.destroy();

          if (donutRef.current) {
            donutInstance.current = new Chart(donutRef.current, {
              type: 'doughnut',
              data: {
                labels: ['Finished', 'WIP', 'Backlog'],
                datasets: [{
                  data: [totalPainted, totalWip, totalBacklog],
                  backgroundColor: ['#22c55e', '#f59e0b', '#ef4444'],
                  borderWidth: 0
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', boxWidth: 12, padding: 12 } } }
              }
            });
          }

          if (barRef.current) {
            barInstance.current = new Chart(barRef.current, {
              type: 'bar',
              data: {
                labels: factions.map(f => f.name),
                datasets: [
                  { label: 'Painted', data: factions.map(f => f.painted), backgroundColor: '#22c55e' },
                  { label: 'WIP', data: factions.map(f => f.wip), backgroundColor: '#f59e0b' },
                  { label: 'Backlog', data: factions.map(f => f.backlog), backgroundColor: '#ef4444' }
                ]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                  x: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } },
                  y: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } }
                },
                plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', boxWidth: 12, padding: 12 } } }
              }
            });
          }
        }
      }, [factions, currentTab]);

      // Global Pie Chart Render
      useEffect(() => {
        if (currentTab === 'leaderboard' && leaderboardSubTab === 'global') {
          if (globalPieInstance.current) globalPieInstance.current.destroy();

          if (globalPieRef.current) {
            globalPieInstance.current = new Chart(globalPieRef.current, {
              type: 'pie',
              data: {
                labels: ['Completed / Painted', 'In Progress (WIP)', 'Backlog (Grey)'],
                datasets: [{
                  data: [globalTotalPainted, globalTotalWip, globalTotalBacklog],
                  backgroundColor: ['#22c55e', '#f59e0b', '#ef4444'],
                  borderColor: '#0f172a',
                  borderWidth: 2
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                  legend: { position: 'bottom', labels: { color: '#f8fafc', font: { size: 13, weight: 'bold' }, padding: 16 } },
                  tooltip: {
                    callbacks: {
                      label: function(context) {
                        const val = context.raw || 0;
                        const pct = ((val / globalTotalModels) * 100).toFixed(1);
                        return ` ${context.label}: ${val} models (${pct}%)`;
                      }
                    }
                  }
                }
              }
            });
          }
        }
      }, [currentTab, leaderboardSubTab, globalTotalPainted, globalTotalWip, globalTotalBacklog, globalTotalModels]);

      // Leaderboard Sorted Data Calculations
      const currentUserObj = {
        id: 'user_current',
        name: 'You (Your Account)',
        avatar: '🎨',
        isPublic: isDashboardPublic,
        monthlyOutput: monthlyCompleted,
        yearlyOutput: yearlyCompleted,
        stats: { total: totalCollection, painted: totalPainted, wip: totalWip, backlog: totalBacklog }
      };

      const allLeaderboardUsers = [currentUserObj, ...INITIAL_COMMUNITY_USERS];

      const monthlyLeaderboard = [...allLeaderboardUsers].sort((a, b) => b.monthlyOutput - a.monthlyOutput);
      const yearlyLeaderboard = [...allLeaderboardUsers].sort((a, b) => b.yearlyOutput - a.yearlyOutput);

      return (
        <div className="max-w-7xl mx-auto px-4 py-4 sm:p-6 space-y-6">
          
          {/* Main Top Navigation Header */}
          <header className="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-800 pb-4 gap-4">
            <div>
              <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight text-white flex items-center gap-2">
                <span>🖌️</span> MiniBacklog Hub
              </h1>
              <p className="text-slate-400 text-xs sm:text-sm">Global community metrics, rankings & private backlog tracking</p>
            </div>

            {/* View Switcher Tabs */}
            <div className="flex items-center gap-1.5 bg-slate-900 p-1.5 rounded-2xl border border-slate-800 w-full sm:w-auto">
              <button
                onClick={() => setCurrentTab('home')}
                className={`touch-target flex-1 sm:flex-initial px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1.5 ${
                  currentTab === 'home'
                    ? 'bg-emerald-600 text-white shadow-lg'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                <span>🌍</span> Home
              </button>
              
              <button
                onClick={() => setCurrentTab('leaderboard')}
                className={`touch-target flex-1 sm:flex-initial px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1.5 ${
                  currentTab === 'leaderboard'
                    ? 'bg-emerald-600 text-white shadow-lg'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                <span>🏆</span> Leaderboard
              </button>

              <button
                onClick={() => setCurrentTab('personal')}
                className={`touch-target flex-1 sm:flex-initial px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1.5 ${
                  currentTab === 'personal'
                    ? 'bg-emerald-600 text-white shadow-lg'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                <span>👤</span> My Dashboard
              </button>
            </div>
          </header>

          {/* 1. COMMUNITY HOME PAGE */}
          {currentTab === 'home' && (
            <div className="space-y-6">
              
              {/* Daily Spotlight Hero Banner */}
              <div className="bg-gradient-to-r from-slate-900 via-slate-900 to-emerald-950/40 border border-emerald-500/30 rounded-2xl overflow-hidden shadow-2xl grid grid-cols-1 md:grid-cols-12">
                <div className="md:col-span-5 h-56 sm:h-72 md:h-auto relative bg-slate-950">
                  <img 
                    src={dailyFeaturedUser.featuredModel.imageUrl} 
                    alt={dailyFeaturedUser.featuredModel.title}
                    className="w-full h-full object-cover"
                  />
                  <div className="absolute top-3 left-3 flex items-center gap-2">
                    <span className="bg-amber-500/90 text-slate-950 text-[10px] sm:text-xs font-extrabold uppercase px-3 py-1 rounded-full backdrop-blur-sm shadow-lg flex items-center gap-1">
                      <span>🌟</span> Daily Community Showcase
                    </span>
                  </div>
                </div>
                <div className="md:col-span-7 p-5 sm:p-7 flex flex-col justify-between space-y-4">

                <div className="md:col-span-7 p-4 sm:p-6 flex flex-col justify-between space-y-3">
                  <div>
                    <div className="text-[10px] sm:text-xs font-semibold text-emerald-400 uppercase tracking-wider mb-0.5">
                      {featuredModel.faction} • {featuredModel.date}
                    </div>
                    <h2 className="text-xl sm:text-2xl font-bold text-white mb-2">{featuredModel.title}</h2>
                    <div className="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 text-xs sm:text-sm text-slate-300">
                      <span className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Recipe / Notes:</span>
                      <p className="italic leading-relaxed">{featuredModel.notes}</p>
                    </div>
                  </div>
                </div>
              </div>

              {/* Direct Steppers */}
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 space-y-3">
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="text-base sm:text-lg font-bold text-white">Direct Steppers</h2>
                    <p className="text-xs text-slate-400">Quick adjust ground truth numbers per category.</p>
                  </div>
                  <button 
                    onClick={() => setShowManageModal(true)}
                    className="touch-target bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold px-3 py-1.5 rounded-xl border border-slate-700"
                  >
                    ⚙️ Manage Categories
                  </button>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                  {factions.map(f => (
                    <div key={f.id} className="bg-slate-950 border border-slate-800/80 rounded-xl p-3 space-y-2">
                      <div className="font-bold text-white text-sm border-b border-slate-800/60 pb-1.5 flex justify-between items-center">
                        <div>
                          <span>{f.name}</span>
                          {f.system && <span className="block text-[9px] font-normal text-slate-500">{f.system}</span>}
                        </div>
                        <span className="text-[10px] font-normal text-slate-400">Total: {f.painted + f.wip + f.backlog}</span>
                      </div>

                      <div className="flex items-center justify-between text-xs">
                        <span className="text-emerald-400 font-semibold">Painted</span>
                        <div className="flex items-center gap-1.5">
                          <button onClick={() => handleStepperAdjust(f.name, 'painted', -1)} className="touch-target w-9 h-9 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-200 font-bold text-base flex items-center justify-center">-</button>
                          <span className="w-7 text-center font-bold text-white text-sm">{f.painted}</span>
                          <button onClick={() => handleStepperAdjust(f.name, 'painted', 1)} className="touch-target w-9 h-9 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-200 font-bold text-base flex items-center justify-center">+</button>
                        </div>
                      </div>

                      <div className="flex items-center justify-between text-xs">
                        <span className="text-amber-400 font-semibold">WIP</span>
                        <div className="flex items-center gap-1.5">
                          <button onClick={() => handleStepperAdjust(f.name, 'wip', -1)} className="touch-target w-9 h-9 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-200 font-bold text-base flex items-center justify-center">-</button>
                          <span className="w-7 text-center font-bold text-white text-sm">{f.wip}</span>
                          <button onClick={() => handleStepperAdjust(f.name, 'wip', 1)} className="touch-target w-9 h-9 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-200 font-bold text-base flex items-center justify-center">+</button>
                        </div>
                      </div>

                      <div className="flex items-center justify-between text-xs">
                        <span className="text-red-400 font-semibold">Grey</span>
                        <div className="flex items-center gap-1.5">
                          <button onClick={() => handleStepperAdjust(f.name, 'backlog', -1)} className="touch-target w-9 h-9 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-200 font-bold text-base flex items-center justify-center">-</button>
                          <span className="w-7 text-center font-bold text-white text-sm">{f.backlog}</span>
                          <button onClick={() => handleStepperAdjust(f.name, 'backlog', 1)} className="touch-target w-9 h-9 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-200 font-bold text-base flex items-center justify-center">+</button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Charts */}
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-4">
                  <h2 className="text-sm font-semibold mb-2 text-white">Status Breakdown</h2>
                  <div className="h-48 sm:h-56 relative">
                    <canvas ref={donutRef}></canvas>
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-xl p-4">
                  <h2 className="text-sm font-semibold mb-2 text-white">Category Progress</h2>
                  <div className="h-48 sm:h-56 relative">
                    <canvas ref={barRef}></canvas>
                  </div>
                </div>
              </div>

              {/* Bucket Transition Form */}
              <div ref={formRef} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 space-y-4">
                <div>
                  <h2 className="text-lg sm:text-xl font-bold text-white">Log Transition</h2>
                  <p className="text-slate-400 text-xs">Move models between buckets accurately.</p>
                </div>

                <form onSubmit={handleSubmit} className="space-y-3">
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                      <label className="block text-[10px] font-semibold text-slate-400 uppercase mb-1">Category / Army</label>
                      <select 
                        value={form.faction} 
                        onChange={e => setForm({ ...form, faction: e.target.value })}
                        className="touch-target w-full bg-slate-950 border border-slate-800 rounded-xl px-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                      >
                        {factions.map(f => (
                          <option key={f.id} value={f.name}>{f.name} {f.system ? `(${f.system})` : ''}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-[10px] font-semibold text-slate-400 uppercase mb-1">Transition Action</label>
                      <select 
                        value={form.transition} 
                        onChange={e => setForm({ ...form, transition: e.target.value })}
                        className="touch-target w-full bg-slate-950 border border-slate-800 rounded-xl px-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                      >
                        <option value="wip_to_painted">🎨 Finished Painting (WIP ➔ Painted)</option>
                        <option value="backlog_to_wip">✂️ Started Assembling (Grey ➔ WIP)</option>
                        <option value="backlog_to_painted">🚀 Direct Finish (Grey ➔ Painted)</option>
                        <option value="new_purchase">📦 New Purchase (+ To Grey)</option>
                        <option value="sold_trim">🗑️ Trimmed / Sold (- From Grey)</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-[10px] font-semibold text-slate-400 uppercase mb-1">Model Count</label>
                      <input 
                        type="number" 
                        min="1" 
                        value={form.amount} 
                        onChange={e => setForm({ ...form, amount: e.target.value })}
                        className="touch-target w-full bg-slate-950 border border-slate-800 rounded-xl px-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[10px] font-semibold text-slate-400 uppercase mb-1">Model / Squad Name</label>
                      <input 
                        type="text" 
                        placeholder="e.g. Ork Boyz Squad" 
                        value={form.title} 
                        onChange={e => setForm({ ...form, title: e.target.value })}
                        className="touch-target w-full bg-slate-950 border border-slate-800 rounded-xl px-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                      />
                    </div>

                    <div>
                      <label className="block text-[10px] font-semibold text-slate-400 uppercase mb-1">Photo</label>
                      <input 
                        type="file" 
                        accept="image/*"
                        onChange={handleImageUpload}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-slate-400 file:mr-3 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-emerald-400"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-[10px] font-semibold text-slate-400 uppercase mb-1">Notes / Recipe</label>
                    <textarea 
                      rows="2" 
                      placeholder="Paints or techniques used..." 
                      value={form.notes} 
                      onChange={e => setForm({ ...form, notes: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
                    ></textarea>
                  </div>

                  <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 pt-1">
                    <label className="flex items-center gap-2 cursor-pointer text-xs text-slate-300">
                      <input 
                        type="checkbox" 
                        checked={form.setFeatured} 
                        onChange={e => setForm({ ...form, setFeatured: e.target.checked })}
                        className="w-4 h-4 rounded bg-slate-950 border-slate-800 text-emerald-500"
                      />
                      <span>Set as Featured Spotlight</span>
                    </label>

                    <button 
                      type="submit" 
                      className="touch-target w-full sm:w-auto bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 rounded-xl transition-all shadow-lg"
                    >
                      Log Transition
                    </button>
                  </div>
                </form>
              </div>

              {/* Showcase Stream */}
              <div className="space-y-3">
                <h2 className="text-lg font-bold text-white">Your Showcase Stream</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                  {gallery.map(item => (
                    <div key={item.id} className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-md flex flex-col justify-between">
                      <div>
                        <div className="h-40 sm:h-48 bg-slate-950 overflow-hidden relative">
                          <img src={item.imageUrl} alt={item.title} className="w-full h-full object-cover" />
                          <span className="absolute top-2 right-2 bg-slate-900/90 backdrop-blur-md text-emerald-400 text-[10px] font-bold px-2 py-0.5 rounded border border-slate-700">
                            +{item.count} Transitioned
                          </span>
                        </div>
                        <div className="p-3 space-y-1">
                          <div className="text-[10px] font-semibold text-emerald-400 uppercase">{item.faction} • {item.date}</div>
                          <h3 className="font-bold text-white text-base leading-snug">{item.title}</h3>
                          <p className="text-xs text-slate-400 italic line-clamp-2">{item.notes}</p>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Mobile Floating CTA */}
              <div className="fixed bottom-4 right-4 sm:hidden z-40">
                <button 
                  onClick={scrollToForm}
                  className="touch-target bg-emerald-500 hover:bg-emerald-400 active:bg-emerald-600 text-slate-950 font-extrabold px-5 rounded-full shadow-2xl flex items-center gap-2 border border-emerald-300"
                >
                  <span>✏️</span> Log Progress
                </button>
              </div>

            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
